<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Custom HP-Style Calculator - Portrait</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  .state-btn {
    background: #2b2b3b;
    color: white;
    border: 1px solid #3f4652;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
  }

  .state-btn:hover {
    background: #3a4050;
  }

  :root {
    --calc-width: 95vw;
    --aspect-ratio: 0.65;   /* Portrait: taller than wide */
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101015;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  .calc-wrapper {
    width: var(--calc-width);
    max-width: 95vw;
    position: relative;
  }

  .calc-wrapper::before {
    content: "";
    display: block;
    padding-top: calc(100% / var(--aspect-ratio)); /* fixed ratio */
  }

  .calc {
    position: absolute;
    inset: 0;
    background: #1b1d22;
    border-radius: 22px;
    padding: 16px 16px 12px;
    box-shadow: 0 0 30px rgba(0,0,0,0.85);
    border: 2px solid #3f4652;
    display: flex;
    flex-direction: column;
  }

  .branding {
    display: flex;
    justify-content: space-between;
    color: #e0e0e0;
    font-size: 12px;
    margin-bottom: 8px;
  }

  .branding .model {
    font-weight: 600;
    letter-spacing: 1.2px;
  }

  .display {
    background: #050608;
    border-radius: 10px;
    padding: 8px 10px;
    margin-bottom: 12px;
    border: 1px solid #333a45;
    color: #9dfc9d;
    font-family: "Courier New", monospace;
  }

  .display-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    line-height: 1.4;
  }

  .display-line span.label {
    color: #7a8694;
    margin-right: 6px;
  }

  .display-line span.value {
    min-width: 120px;
    text-align: right;
  }

  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #b0b7c3;
    margin-top: 6px;
  }

  .keys {
    margin-top: 10px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 5px;
    margin-bottom: 20px;
  }

  .key {
    position: relative;
    background: #262a33;
    border-radius: 10px;
    padding: 8px 3px 16px;
    text-align: center;
    color: #f5f5f5;
    font-size: 14px;
    cursor: pointer;
    border: 1px solid #3f4652;
    user-select: none;
    box-shadow: 0 2px 0 rgba(0,0,0,0.7);
    transition: background 0.1s, transform 0.05s, box-shadow 0.05s;
  }

  .key:active {
    background: #343a46;
    transform: translateY(1px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.7);
  }

  .key-main {
    display: block;
    font-size: 15px;
  }

  .key-op {
    background: #3b2b2b;
  }

  .key-enter {
    padding-top: 10px;
    padding-bottom: 10px;
    background: #2b3b4f;
  }

  .key-on {
    background: #355835;
    font-size: 12px;
  }

  .key-mode {
    background: #2b2b3b;
  }

  .key-f {
    background: #f7c94b;
    color: #000;
  }

  .key-g {
    background: #6bb7ff;
    color: #000;
  }

  .display.off {
    background: #000 !important;
  }

  .display.off * {
    color: #000 !important;
  }

  /* Landscape orientation for smaller screens */
  @media (orientation: landscape) and (max-height: 500px) {
    :root {
      --calc-width: 90vw;
      --aspect-ratio: 1.5;
    }

    .calc {
      padding: 12px 16px 10px;
    }

    body {
      align-items: flex-start;
      padding-top: 10px;
    }

    .display-line {
      font-size: 12px;
    }

    .display-line span.value {
      min-width: 100px;
    }
  }

</style>
</head>
<body>

<div id="programDisplay" style="
  font-size:12px;
  color:#9dfc9d;
  margin-top:6px;
"></div>

<div id="matrixEditor" style="
  display:none;
  position:fixed;
  inset:0;
  background:#000c;
  justify-content:center;
  align-items:center;
">

  <div style="background:#1b1d22; padding:20px; border-radius:10px;">
    <h3 style="color:white">Matrix Editor (A)</h3>
    <div id="matrixGrid"></div>
    <button onclick="saveMatrix()">Save</button>
    <button onclick="closeMatrix()">Cancel</button>
  </div>
</div>

<div id="stateButtons" style="
    display:flex;
    justify-content:center;
    gap:10px;
    margin-bottom:12px;
">
    <button onclick="exportStateFile()">SAVE JSON</button>
    <button onclick="document.getElementById('loadStateFile').click()">
        LOAD JSON
    </button>
    <input
        id="loadStateFile"
        type="file"
        accept=".json"
        style="display:none"
    >
</div>

<div class="calc-wrapper">
  <div class="calc">
    <div class="branding">
      <div class="brand">Milan Greenman</div>
      <div class="model">MG-15C RPN</div>
    </div>

    <div class="display" id="display">
      <div class="display-line">
        <span class="label">T</span><span class="value" id="dispT">0</span>
      </div>
      <div class="display-line">
        <span class="label">Z</span><span class="value" id="dispZ">0</span>
      </div>
      <div class="display-line">
        <span class="label">Y</span><span class="value" id="dispY">0</span>
      </div>
      <div class="display-line">
        <span class="label">X</span><span class="value" id="dispX">0</span>
      </div>
      <div class="status-bar">
        <span id="statusMode">RPN</span>
        <span id="statusUser"></span>
        <span id="statusFlags">DEG | f:OFF g:OFF</span>
      </div>
    </div>

    <div class="keys">
      <!-- Row 1 -->
      <div class="row">
        <button class="key" onmousedown="startMatrixPreview('A')" onmouseup="endMatrixPreview()" onmouseleave="endMatrixPreview()" onclick="pressKey(1,1)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#6bb7ff; font-size:11px;">A</span><span class="key-main">√x</span></button>
        <button class="key" onmousedown="startMatrixPreview('B')" onmouseup="endMatrixPreview()" onmouseleave="endMatrixPreview()" onclick="pressKey(1,2)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#6bb7ff; font-size:11px;">B</span><span class="key-main">e^x</span></button>
        <button class="key" onmousedown="startMatrixPreview('C')" onmouseup="endMatrixPreview()" onmouseleave="endMatrixPreview()" onclick="pressKey(1,3)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#6bb7ff; font-size:11px;">C</span><span class="key-main">10^x</span></button>
        <button class="key" onmousedown="startMatrixPreview('D')" onmouseup="endMatrixPreview()" onmouseleave="endMatrixPreview()" onclick="pressKey(1,4)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#6bb7ff; font-size:11px;">D</span><span class="key-main">y^x</span></button>
        <button class="key" onmousedown="startMatrixPreview('E')" onmouseup="endMatrixPreview()" onmouseleave="endMatrixPreview()" onclick="pressKey(1,5)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#6bb7ff; font-size:11px;">E</span><span class="key-main">1/x</span></button>
        <button class="key" onclick="pressKey(1,6)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">MATRIX</span><span class="key-main">CHS</span></button>
        <button class="key" onclick="pressKey(1,7)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">FIX</span><span class="key-main">7</span></button>
        <button class="key" onclick="pressKey(1,8)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">SCI</span><span class="key-main">8</span></button>
        <button class="key" onclick="pressKey(1,9)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">ENG</span><span class="key-main">9</span></button>
        <button class="key key-op" onclick="pressKey(1,0)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">SOLVE</span><span class="key-main">÷</span></button>
      </div>

      <!-- Row 2 -->
      <div class="row">
        <button class="key key-mode" onmousedown="startSSTHold()" onmouseup="endSSTHold()" onmouseleave="endSSTHold()" onclick="return false;"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">SST</span><span class="key-main">R/S</span></button>
        <button class="key key-mode" onclick="pressKey(2,2)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">HYP</span><span class="key-main">GSB</span></button>
        <button class="key" onclick="pressKey(2,3)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">DIM</span><span class="key-main">R↓</span></button>
        <button class="key" onmousedown="startViewIM()" onmouseup="endViewIM()" onmouseleave="endViewIM()" onclick="pressKey(2,4)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">IM</span><span class="key-main">X↔Y</span></button>
        <button class="key" onclick="pressKey(2,5)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">I</span><span class="key-main">←</span></button>
        <button class="key" onclick="pressKey(2,6)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">RESULT</span><span class="key-main">4</span></button>
        <button class="key" onclick="pressKey(2,7)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">X↔</span><span class="key-main">5</span></button>
        <button class="key" onclick="pressKey(2,8)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">DSE</span><span class="key-main">6</span></button>
        <button class="key" onclick="pressKey(2,9)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">ISG</span><span class="key-main">×</span></button>
        <button class="key key-op" onclick="pressKey(2,0)"><span style="position:absolute; top:-18px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:16px;">∫ˣᵧ</span><span class="key-main" style="font-size:12px;">∫</span></button>
      </div>

      <!-- Row 3 -->
      <div class="row">
        <button class="key key-mode" onclick="pressKey(3,1)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">PSE</span><span class="key-main">ON</span></button>
        <button class="key key-mode" onclick="pressKey(3,2)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">Σ</span><span class="key-main">f</span></button>
        <button class="key" onclick="pressKey(3,3)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">PRGM</span><span class="key-main">g</span></button>
        <button class="key" onclick="pressKey(3,4)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">REG</span><span class="key-main">STO</span></button>
        <button class="key" onmousedown="startPrefixHold()" onmouseup="endPrefixHold()" onmouseleave="endPrefixHold()" onclick="pressKey(3,5)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">MAN</span><span class="key-main">RCL</span></button>
        <button class="key key-enter" style="grid-row: span 2; grid-column: 6;" onclick="pressKey(4,6)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">ENTER</span><span class="key-main" style="font-size:18px;">⏎</span></button>
        <button class="key" onclick="pressKey(3,7)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">→R</span><span class="key-main">1</span></button>
        <button class="key" onclick="pressKey(3,8)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">→H.MS</span><span class="key-main">2</span></button>
        <button class="key" onclick="pressKey(3,9)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">→RAD</span><span class="key-main">3</span></button>
        <button class="key key-op" onclick="pressKey(3,0)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">Re↔Im</span><span class="key-main">−</span></button>
      </div>

      <!-- Row 4 -->
      <div class="row">
        <button class="key" onclick="pressKey(4,1)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">x!</span><span class="key-main">0</span></button>
        <button class="key" onclick="pressKey(4,2)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">ŷ,r</span><span class="key-main">•</span></button>
        <button class="key" onclick="pressKey(4,3)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">L.R.</span><span class="key-main">EEX</span></button>
        <button class="key" onclick="pressKey(4,4)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">Py,x</span><span class="key-main">+/−</span></button>
        <button class="key" onclick="pressKey(4,5)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">FRAC</span><span class="key-main">SIN</span></button>
        <button class="key" onclick="pressKey(4,7)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">USER</span><span class="key-main">COS</span></button>
        <button class="key" onclick="pressKey(4,8)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">MATRIX</span><span class="key-main">TAN</span></button>
        <button class="key" onclick="pressKey(4,9)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">RESULT</span><span class="key-main">LN</span></button>
        <button class="key" onclick="pressKey(4,0)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">I</span><span class="key-main">LOG</span></button>
        <button class="key key-op" onclick="pressKey(4,1)"><span style="position:absolute; top:-14px; left:50%; transform:translateX(-50%); color:#f7c94b; font-size:11px;">π</span><span class="key-main">+</span></button>
      </div>
    </div>
  </div>
</div>

<div id="registerPanel" style="
  margin-top: 18px;
  color: #6bb7ff;
  font-family: monospace;
  font-size: 11px;
  line-height: 1.4;
  text-align: center;
"></div>

<script>
let pendingCommand = "";
let displayMode = "NORMAL";
let fixDigits = 4;
let powerOn = true;
let entering = false;
let inputBuffer = "";
let justCalculated = false;
let angleMode = "DEG";
let rngSeed = 0;
let pendingRegister = null;
let registerDecimal = false;
let liftOnNextDigit = false;
let continueEntry = false;
let prefixDisplay = "";
let prefixHold = false;
let currentMatrixName = null;
let viewIM = false;
let viewIMTimer = null;
let USER = false;
let pendingResultTarget = false;
let matrixResultTarget = "C";
let matrixEntryMode = false;
let matrixEntryTarget = null;
let matrixEntryIndex = 0;
let lastMatrixKey = null;
let matrixStorePreview = null;
let callStack = [];
let pendingMatrixRecall = false;
let pendingMatrixOp = null;
let runMode = true;
let programMode = false;
let programLabel = "";
let state = "IDLE";
let buildBuffer = [];
let labelMode = false;
let programStart = "";
let execPC = 0;
let singleStepMode = false;
let sstHeld = false;
let execRunning = false;
let DoIfTrue = true;
let pendingGotoLine = false;
let gotoBuffer = "";
let pendingGotoLineEdit = false;
let gotoLineBuffer = "";
let displayError = "";
let execPauseUntil = 0;
let programJumped = false;
let programPaused = false;
let programStartPC = 0;

const REG_I = 66;
const prefixOps = ["dim", "matrix_mode", "result", "lbl", "gto", "gsb", "solve", "integrate", "fix", "SF", "CF", "FS", "test"];

// Stack
let S = { X:0, Y:0, Z:0, T:0 };
let IM = { X:0, Y:0, Z:0, T:0 };
let lastX = 0;
let lastIMX = 0;

// Flags
let F = Array(10).fill(false);

// Registers
let R = Array(67).fill(0);

// Matrix storage
let M = { A: null, B: null, C: null, D: null, E: null };

// Modes
let shiftF = false, shiftG = false;
let hypMode = false;
let iHypMode = false;
const MAX_STEPS = 1000;
let prog = new Array(MAX_STEPS).fill(null);
let pc = 0;
let progSize = 0;
let labels = {};

function formatInstruction(i) {
  if(i.op === "digit") return `NUM ${i.v}`;
  return i.op.toUpperCase();
}

function startPrefixHold() {
  if (!shiftF) return;
  prefixHold = true;
  updateDisplay();
}

function endPrefixHold() {
  prefixHold = false;
  updateDisplay();
}

function startViewIM() {
  if (!shiftF) return;
  viewIM = true;
  if (viewIMTimer) {
    clearTimeout(viewIMTimer);
    viewIMTimer = null;
  }
  updateDisplay();
}

function endViewIM() {
  viewIMTimer = setTimeout(() => {
    viewIM = false;
    updateDisplay();
  }, 2000);
}

function push(x) {
  S.T = S.Z; S.Z = S.Y; S.Y = S.X; S.X = x;
  IM.T = IM.Z; IM.Z = IM.Y; IM.Y = IM.X;
}

function drop() {
  S.X = S.Y; S.Y = S.Z; S.Z = S.T;
  IM.X = IM.Y; IM.Y = IM.Z; IM.Z = IM.T;
}

function updateDisplay() {
  document.getElementById('dispT').textContent = formatNumber(S.T);
  document.getElementById('dispZ').textContent = formatNumber(S.Z);
  document.getElementById('dispY').textContent = formatNumber(S.Y);
  document.getElementById('dispX').textContent = formatNumber(S.X);
}

function formatNumber(n) {
  if (isNaN(n)) return "NaN";
  if (!isFinite(n)) return n > 0 ? "∞" : "-∞";
  return n.toPrecision(6);
}

function pressKey(row, col) {
  console.log(`Key pressed: Row ${row}, Col ${col}`);
  updateDisplay();
}

function startSSTHold() {
  sstHeld = true;
}

function endSSTHold() {
  sstHeld = false;
}

function startMatrixPreview(name) {
  console.log(`Matrix preview: ${name}`);
}

function endMatrixPreview() {
  console.log("Matrix preview ended");
}

function saveMatrix() {
  console.log("Matrix saved");
}

function closeMatrix() {
  document.getElementById('matrixEditor').style.display = 'none';
}

function exportStateFile() {
  console.log("Exporting state...");
}

// Initialize display
updateDisplay();
</script>

</body>
</html>

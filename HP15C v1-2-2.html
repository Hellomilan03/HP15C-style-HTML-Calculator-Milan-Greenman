<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Custom HP-Style Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  .state-btn {
    background: #2b2b3b;
    color: white;
    border: 1px solid #3f4652;
    border-radius: 8px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 14px;
}

.state-btn:hover {
    background: #3a4050;
}
  :root {
    --calc-width: 720px;   /* medium fixed size */
    --aspect-ratio: 1.32;   /* width / height */
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #101015;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .calc-wrapper {
    width: var(--calc-width);
    max-width: 95vw;
    position: relative;
  }
  .calc-wrapper::before {
    content: "";
    display: block;
    padding-top: calc(100% / var(--aspect-ratio)); /* fixed ratio */
  }
  .calc {
    position: absolute;
    inset: 0;
    background: #1b1d22;
    border-radius: 22px;
    padding: 24px 24px 18px;
    box-shadow: 0 0 30px rgba(0,0,0,0.85);
    border: 2px solid #3f4652;
    display: flex;
    flex-direction: column;
  }
  .branding {
    display: flex;
    justify-content: space-between;
    color: #e0e0e0;
    font-size: 16px;
    margin-bottom: 10px;
  }
  .branding .model {
    font-weight: 600;
    letter-spacing: 1.2px;
  }
  .display {
    background: #050608;
    border-radius: 10px;
    padding: 10px 12px;
    margin-bottom: 16px;
    border: 1px solid #333a45;
    color: #9dfc9d;
    font-family: "Courier New", monospace;
  }
  .display-line {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
    line-height: 1.4;
  }
  .display-line span.label {
    color: #7a8694;
    margin-right: 6px;
  }
  .display-line span.value {
    min-width: 180px;
    text-align: right;
  }
  .status-bar {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #b0b7c3;
    margin-top: 6px;
  }
  .keys {
    margin-top: 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(10, 1fr); /* even columns */
    gap: 7px;
    margin-bottom: 30px;
  }
  .key {
    position: relative;
    background: #262a33;
    border-radius: 12px;          /* rounded tall keys */
    padding: 10px 4px 20px;       /* tall */
    text-align: center;
    color: #f5f5f5;
    font-size: 16px;
    cursor: pointer;
    border: 1px solid #3f4652;
    user-select: none;
    box-shadow: 0 3px 0 rgba(0,0,0,0.7);
    transition: background 0.1s, transform 0.05s, box-shadow 0.05s;
  }
  .key:active {
    background: #343a46;
    transform: translateY(1px);
    box-shadow: 0 2px 0 rgba(0,0,0,0.7);
  }
  .key-main {
    display: block;
    font-size: 17px;
  }
  .key-op {
    background: #3b2b2b;
  }
  .key-enter {
 padding-top:14px;
  padding-bottom: 14px;
    background: #2b3b4f;
  }
  .key-on {
    background: #355835;
    font-size: 14px;
  }
  .key-mode {
    background: #2b2b3b;
  }
.key-f {
  background: #f7c94b;   /* HP Voyager gold */
  color: #000;           /* dark text for contrast */
}
.display.off {
  background: #000 !important;
}
/*  Force ALL text inside display to go black */
.display.off * {
  color: #000 !important;
}
.key-g {
  background: #6bb7ff;   /* HP Voyager blue */
  color: #000;           /* dark text for contrast */
}
  @media (max-width: 600px) {
    :root {
      --calc-width: 95vw;
    }
    .display-line span.value {
      min-width: 140px;
    }
  }

</style>

<div class="display" id="display">

<script>

function startViewIM() {

/* =========================

========================= */
// Stack (X,Y,Z,T)

let IM = { X:0, Y:0, Z:0, T:0 };
let lastX = 0;
let lastIMX = 0;
// Flags (F0-F9)
let F = Array(10).fill(false);
// Registers (0–9)
let R = Array(67).fill(0);
// Matrix storage (A–E like 15C)
let M = {
  A: null,
  B: null,
  C: null,
  D: null,

};

// Modes
let shiftF=false, shiftG=false;
let hypMode = false;
let iHypMode = false;
const MAX_STEPS = 1000;
let prog = new Array(MAX_STEPS).fill(null);
let pc = 0;              // program counter
let progSize = 0;        // highest written step
let labels={};

/* =========================
   STACK OPS
========================= */

function push(x){
  S.T=S.Z; S.Z=S.Y; S.Y=S.X; S.X=x;
  IM.T=IM.Z; IM.Z=IM.Y; IM.Y=IM.X;
}

function drop(){
  S.X=S.Y; S.Y=S.Z; S.Z=S.T;
  IM.X=IM.Y; IM.Y=IM.Z; IM.Z=IM.T;
}

/* =========================
   MATRIX ENGINE
========================= */
function bin(op){
  const a = S.Y;
  const b = S.X;
  //  MATRIX PATH
  if (isMatrix(a) || isMatrix(b)) {
    let A = isMatrix(a) ? M[a.name] : a;

    if (op === "add") result = matrixAdd(A, B);
    else if (op === "sub") result = matrixSub(A, B);
    else if (op === "mul") result = matrixMul(A, B);

else if (op === "div") {
  const aIsMatrix = isMatrix(a);
  const bIsMatrix = isMatrix(b);
  // ✅ MATRIX ÷ MATRIX
  if (aIsMatrix && bIsMatrix) {
    let A = M[a.name];
    let B = M[b.name];

// ✅ basic validation (ONLY square check remains)
if (!A || !B || B.rows !== B.cols) {
  S.X = NaN;

}

let invB = matrixInverse(B);

  S.X = NaN;
  return;
}
let result = null;
// ✅ FIRST: try Y × X⁻¹
if (A.cols === invB.rows) {
  result = matrixMul(A, invB);
}
// ✅ SECOND: try X⁻¹ × Y  (THIS FIXES YOUR CASE)
else if (invB.cols === A.rows) {
  result = matrixMul(invB, A);
}
// ✅ neither worked
if (!result) {
  S.X = NaN;
  return;
}
// ✅ HP behavior
drop();
storeMatrixResult(result);
    justCalculated = true;
    liftOnNextDigit = true;
    return;
  }
  // ✅ MATRIX ÷ SCALAR
  if (aIsMatrix && !bIsMatrix) {
    let A = M[a.name];
    let scalar = b;
    if (scalar === 0) {
      S.X = NaN;
      return;
    }
    let result = {
      rows: A.rows,
      cols: A.cols,
      data: A.data.map(v => v / scalar)
    };
    drop();
    storeMatrixResult(result);
    return;
  }
  // ✅ SCALAR ÷ MATRIX
  if (!aIsMatrix && bIsMatrix) {
    let scalar = a;
    let B = M[b.name];
    if (!B || B.rows !== B.cols) {
      S.X = NaN;
      return;
    }
    let invB = matrixInverse(B);
    if (!invB) {
      S.X = NaN;
      return;
    }
    let result = {
      rows: invB.rows,
      cols: invB.cols,
      data: invB.data.map(v => scalar * v)
    };
    drop();
    storeMatrixResult(result);
    return;
  }
}

// ✅ Only run if result exists (add/sub/mul path)
if (result && result.rows) {
  drop();
  storeMatrixResult(result);
  justCalculated = true;
  liftOnNextDigit = true;
}
return;
  }
  //  SCALAR / COMPLEX PATH (PUT BACK INSIDE)
  let ca = complex(S.Y, IM.Y);
  let cb = complex(S.X, IM.X);
  drop();
  let r;
  if (op === "add") r = cAdd(ca,cb);
  else if (op === "sub") r = cSub(ca,cb);
  else if (op === "mul") r = cMul(ca,cb);
  else if (op === "div") r = cDiv(ca,cb);
  setX(r);
}

function matrixAdd(A, B){
  if (typeof A === "number") {
    return matrixScalarAdd(B, A);
  }
  if (typeof B === "number") {
    return matrixScalarAdd(A, B);
  }
  if (A.rows !== B.rows || A.cols !== B.cols){
    return NaN;
  }
  return {
    rows: A.rows,
    cols: A.cols,
    data: A.data.map((v,i)=>v + B.data[i])
  };
}

function matrixSub(A, B){
  if (typeof B === "number") {
    return {
      rows: A.rows,
      cols: A.cols,
      data: A.data.map(v => v - B)
    };
  }
  if (typeof A === "number") {
    return {
      rows: B.rows,
      cols: B.cols,
      data: B.data.map(v => A - v)
    };
  }
  if (A.rows !== B.rows || A.cols !== B.cols){
    return NaN;
  }
  return {
    rows: A.rows,
    cols: A.cols,
    data: A.data.map((v,i) => v - B.data[i])
  };
}

function matrixMul(A, B){
  if (typeof A === "number") {
    return {
      rows: B.rows,
      cols: B.cols,
      data: B.data.map(v => A * v)
    };
  }
  if (typeof B === "number") {
    return {
      rows: A.rows,
      cols: A.cols,
      data: A.data.map(v => v * B)
    };
  }
  if (A.cols !== B.rows){
    return null;
  }
  let result = {
    rows: A.rows,
    cols: B.cols,
    data: []
  };
  for (let r = 0; r < A.rows; r++){
    for (let c = 0; c < B.cols; c++){
      let sum = 0;
      for (let k = 0; k < A.cols; k++){
        sum += A.data[r*A.cols + k] * B.data[k*B.cols + c];
      }
      result.data[r * B.cols + c] = sum;
    }
  }
  return result; //  ONLY RETURN
}

function matrixInverse(A){
  //  must be square
  if (A.rows !== A.cols) return null;
  let n = A.rows;
  let Mx = [];
  let I = [];
  //  Step 1: build working matrix and identity
  for (let i = 0; i < n; i++){
    Mx[i] = [];
    I[i] = [];
    for (let j = 0; j < n; j++){
      Mx[i][j] = A.data[i * n + j];
      I[i][j] = (i === j) ? 1 : 0;
    }
  }
  //  Step 2: Gauss‑Jordan elimination
  for (let i = 0; i < n; i++){

let pivot = Mx[i][i];

// ✅ PARTIAL PIVOTING (HP behavior)
if (pivot === 0) {
  let swapRow = -1;

  for (let r = i + 1; r < n; r++) {
    if (Mx[r][i] !== 0) {
      swapRow = r;
      break;
    }
  }

  if (swapRow === -1) return null; // truly singular

  // swap rows in BOTH matrices
  [Mx[i], Mx[swapRow]] = [Mx[swapRow], Mx[i]];
  [I[i], I[swapRow]] = [I[swapRow], I[i]];
  pivot = Mx[i][i];
}
    // normalize row
    for (let j = 0; j < n; j++){
      Mx[i][j] /= pivot;
      I[i][j] /= pivot;
    }
    // eliminate other rows
    for (let k = 0; k < n; k++){
      if (k !== i){
        let factor = Mx[k][i];
        for (let j = 0; j < n; j++){
          Mx[k][j] -= factor * Mx[i][j];
          I[k][j] -= factor * I[i][j];
        }
      }
    }
  }
  //  flatten result
  return {
    rows: n,
    cols: n,
    data: I.flat()
  };
}

function clearAllMatrices() {
  //  FULL reset of all matrix slots
  for (let name of ["A","B","C","D","E"]) {
    M[name] = {
      rows: 0,
      cols: 0,
      data: []
    };
  }
  //  Exit matrix entry mode
  matrixEntryMode = false;
  matrixEntryTarget = null;
  //  Clear preview / tracking
  matrixStorePreview = null;
  lastMatrixKey = null;
  //  Reset result routing (important!)
  matrixResultTarget = "C";
  //  Reset command system
  pendingCommand = null;
  prefixDisplay = "";
  //  Reset entry state
  entering = false;
  inputBuffer = "";
  liftOnNextDigit = true;
  console.log("All matrices cleared");
}

function getMatrixPosition(m, index) {
  let row = Math.floor(index / m.cols) + 1;
  let col = (index % m.cols) + 1;
  return { row, col };
}

function startMatrixPreview(name) {
  let isSTO = (pendingCommand === "STO" && matrixEntryMode);
let isRCL =
  pendingMatrixRecall ||
  pendingCommand === "RCL";
  if (!isSTO && !isRCL) return;
  let m = M[name];
  if (!m || !m.rows || !m.cols) return;
  let index = getMatrixIndexFromR(m);
  if (index < 0) return;
  let pos = getMatrixPosition(m, index);
  matrixStorePreview = {
    name,
    row: pos.row,
    col: pos.col
  };
  updateDisplay();
}

function endMatrixPreview() {
  //  If doing RCL MATRIX → commit on release
  if (pendingMatrixRecall && matrixStorePreview) {
    let name = matrixStorePreview.name;
    let m = M[name];
    if (m && m.rows && m.cols) {
      let idx = getMatrixIndexFromR(m);
      if (idx >= 0) {
        //  EXACT behavior you described
        push(S.X);
        S.X = m.data[idx];
        stepMatrixPointer(m);
      } else {
        S.X = NaN;
      }
    }
    //  clear recall mode
    pendingMatrixRecall = false;
    pendingCommand = null;
    entering = false;
    inputBuffer = "";
    liftOnNextDigit = true;
  }
  //  always clear preview
  matrixStorePreview = null;
  updateDisplay();
}

function storeMatrixResult(result) {
  let target = matrixResultTarget || "C";
  //  Dimension is automatically set by result object
  M[target] = {
    rows: result.rows,
    cols: result.cols,
    data: [...result.data]
  };
  //  Return reference
  S.X = matrixRef(target);
}

function matrixScalarAdd(M, scalar) {
  return {
    rows: M.rows,
    cols: M.cols,
    data: M.data.map(v => v + scalar)
  };
}

function matrixRef(name){
  return { type: "matrix", name };
}

function isMatrix(x){
  return x && x.type === "matrix";
}

function getMatrixIndexFromR(m) {
  const r = Math.floor(R[0]) - 1; // R0 = row
  const c = Math.floor(R[1]) - 1; // R1 = col
  if (r < 0 || c < 0 || r >= m.rows || c >= m.cols) {
    return -1; // out of bounds
  }
  return r * m.cols + c;
}
function stepMatrixPointer(m) {
  //  advance column first (row-major)
  R[1]++;
  if (R[1] > m.cols) {
    R[1] = 1;
    R[0]++;
  }
  if (R[0] > m.rows) {
    R[0] = 1; // wrap like HP
  }
}

// f MATRIX 2
function ZpairedToZaugmented() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let name = x.name;
  let A = M[name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  // ✅ must be even rows
  if (A.rows % 2 !== 0) {
    S.X = NaN;
    return;
  }
  let n = A.rows / 2;  // complex rows
  let m = A.cols;      // complex columns
  let size = 2 * n;
  let result = {
    rows: size,
    cols: size,
    data: new Array(size * size).fill(0)
  };
  for (let r = 0; r < n; r++) {
    for (let c = 0; c < m; c++) {
      let re = A.data[r * m + c];
      let im = A.data[(r + n) * m + c];
      let r0 = r;
      let r1 = r + n;
      let c0 = c;
      let c1 = c + m;
      // A block
      result.data[r0 * size + c0] = re;
      result.data[r0 * size + c1] = -im;
      result.data[r1 * size + c0] = im;
      result.data[r1 * size + c1] = re;
    }
  }
  M[name] = result;
  S.X = matrixRef(name);
  justCalculated = true;

// f MATRIX 3 (inverse of MATRIX 2)
function ZaugemntedToZpaired() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let name = x.name;
  let A = M[name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  // ✅ must be even rows and even columns
  if (A.rows % 2 !== 0 || A.cols % 2 !== 0) {
    S.X = NaN;
    return;
  }
  let m = A.rows / 2;
  let n = A.cols / 2;
  let result = {
    rows: 2 * m,
    cols: n,
    data: new Array((2 * m) * n)
  };
  // ✅ extract A and B from block matrix
  for (let r = 0; r < m; r++) {
    for (let c = 0; c < n; c++) {
      let re = A.data[r * (2*n) + c];        // top-left
      let im = A.data[(r + m) * (2*n) + c];  // bottom-left
      // store back in partitioned form
      result.data[r * n + c] = re;           // top half
      result.data[(r + m) * n + c] = im;     // bottom half
    }
  }
  // ✅ overwrite same matrix
  M[name] = result;
  S.X = matrixRef(name);
  justCalculated = true;
  liftOnNextDigit = true;
}

// f MATRIX 4
function transpose() {
  let x = S.X;
  // Must be a matrix reference in X
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let name = x.name;
  let A = M[name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  let newData = new Array(A.data.length);
  // Build transposed data
  for (let r = 0; r < A.rows; r++) {
    for (let c = 0; c < A.cols; c++) {
      let src = r * A.cols + c;
      let dst = c * A.rows + r;
      newData[dst] = A.data[src];
    }
  }
  //  OVERWRITE ORIGINAL MATRIX
  M[name] = {
    rows: A.cols,
    cols: A.rows,
    data: newData
  };
  //  Leave S.X pointing to same matrix name
  // (no stack lift, no drop)
  justCalculated = true;
  liftOnNextDigit = true;
}

// f MATRIX 5  y transpose times x /////////////
function yTransposeX(){
  let y = S.Y;
  let x = S.X;
  // ✅ Ensure both are matrix refs
  if (!isMatrix(y) || !isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let Ymat = M[y.name];
  let Xmat = M[x.name];
  // ✅ Validate matrices exist
  if (!Ymat || !Xmat || !Ymat.rows || !Ymat.cols || !Xmat.rows || !Xmat.cols) {
    S.X = NaN;
    return;
  }
  // ✅ Build Y^T (transpose of Y)
  let Yt = {
    rows: Ymat.cols,
    cols: Ymat.rows,
    data: new Array(Ymat.data.length)
  };
  for (let r = 0; r < Ymat.rows; r++) {
    for (let c = 0; c < Ymat.cols; c++) {
      let src = r * Ymat.cols + c;
      let dst = c * Ymat.rows + r;
      Yt.data[dst] = Ymat.data[src];
    }
  }
  // ✅ Multiply Y^T × X
  let result = matrixMul(Yt, Xmat);
  if (!result || !result.rows) {
    S.X = NaN;
    return;
  }
  // ✅ Drop one level (binary op behavior)
  drop();
  // ✅ Store in result matrix (C default or selected)
  storeMatrixResult(result);
  justCalculated = true;
  liftOnNextDigit = true;
}

// f MATRIX 6 /////////////
function residual() {
  let y = S.Y; // A
  let x = S.X; // x
  // ✅ must be matrices
  if (!isMatrix(y) || !isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let A = M[y.name];
  let Xv = M[x.name];
  // ✅ get current result matrix (b)
  let target = matrixResultTarget || "C";
  let b = M[target];
  if (!A || !Xv || !b || !b.rows || !b.cols) {
    S.X = NaN;
    return;
  }
  // ✅ compute A·x
  let Ax = matrixMul(A, Xv);
  if (!Ax || !Ax.rows) {
    S.X = NaN;
    return;
  }

  // ✅ dimension check (b - Ax must match)
  if (b.rows !== Ax.rows || b.cols !== Ax.cols) {
    S.X = NaN;
    return;
  }

  // ✅ compute residual: r = b - Ax
  let result = matrixSub(b, Ax);
  if (!result || !result.rows) {
    S.X = NaN;
    return;
  }

  // ✅ overwrite SAME result matrix (no new slot)
  M[target] = {
    rows: result.rows,
    cols: result.cols,
    data: [...result.data]
  };
  // ✅ return reference to it
  S.X = matrixRef(target);
  // ✅ standard flags (same as your engine style)
  justCalculated = true;
  liftOnNextDigit = true;
}

// f MATRIX 7 /////////////
function Row_Norm() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let A = M[x.name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  let maxSum = 0;
  for (let r = 0; r < A.rows; r++) {
    let sum = 0;
    for (let c = 0; c < A.cols; c++) {
      let val = A.data[r * A.cols + c];
      sum += Math.abs(val);
    }
    if (sum > maxSum) {
      maxSum = sum;
    }
  }
  //  Replace X with scalar
  S.X = maxSum;
  justCalculated = true;
  liftOnNextDigit = true;
}

// f MATRIX 8 ///////////
function Frobenius_of_Euclidean_norm() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let A = M[x.name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  let sum = 0;
  for (let i = 0; i < A.data.length; i++) {
    let v = A.data[i];
    sum += v * v;
  }
  //  Final scalar result
  S.X = Math.sqrt(sum);
  justCalculated = true;
  liftOnNextDigit = true;
}

// f MATRIX 9 ////////////
function Determinant() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let A = M[x.name];
  if (!A || A.rows !== A.cols) {
    S.X = NaN;
    return;
  }
  let n = A.rows;
  //  COPY matrix (do NOT modify original)
  let LU = A.data.slice();
  let sign = 1;
  for (let k = 0; k < n; k++) {
    let pivot = LU[k * n + k];
    //  Handle zero pivot (simple pivoting)
    if (pivot === 0) {
      let swapRow = -1;
      for (let i = k + 1; i < n; i++) {
        if (LU[i * n + k] !== 0) {
          swapRow = i;
          break;
        }
      }
      if (swapRow === -1) {
        S.X = 0;
        return;
      }
      // swap rows
      for (let j = 0; j < n; j++) {
        let idx1 = k * n + j;
        let idx2 = swapRow * n + j;
        let tmp = LU[idx1];
        LU[idx1] = LU[idx2];
        LU[idx2] = tmp;
      }
      sign *= -1;
      pivot = LU[k * n + k];
    }
    // elimination
    for (let i = k + 1; i < n; i++) {
      let factor = LU[i * n + k] / pivot;
      LU[i * n + k] = factor;
      for (let j = k + 1; j < n; j++) {
        LU[i * n + j] -= factor * LU[k * n + j];
      }
    }
  }
  //  determinant = product of diagonal * sign
  let det = sign;
  for (let i = 0; i < n; i++) {
    det *= LU[i * n + i];
  }
  //  Store LU as result matrix
  storeMatrixResult({
    rows: n,
    cols: n,
    data: LU
  });
  //  Replace X with determinant
  S.X = det;
  justCalculated = true;
  liftOnNextDigit = true;
}

// f Py,X matrix (Zc → Zp) complex to partitioned
// f Py,x matrix (Zc → Zp) complex to partitioned
function Zc_to_Zp() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let name = x.name;
  let A = M[name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  // ✅ MUST be n×2 (your complex layout)
  if (A.cols !== 2) {
    S.X = NaN;
    return;
  }
  let n = A.rows;
  let result = {
    rows: 2 * n,
    cols: 1,
    data: new Array(2 * n)
  };
  for (let i = 0; i < n; i++) {
    let re = A.data[i * 2 + 0];
    let im = A.data[i * 2 + 1];
    result.data[i] = re;        // top half
    result.data[i + n] = im;    // bottom half
  }
  // ✅ overwrite same matrix
  M[name] = result;
  S.X = matrixRef(name);
  justCalculated = true;
  liftOnNextDigit = true;
}

// g Cy,x matrix (Zp → Zc) partitioned to complex
function Zp_to_Zc() {
  let x = S.X;
  if (!isMatrix(x)) {
    S.X = NaN;
    return;
  }
  let name = x.name;
  let A = M[name];
  if (!A || !A.rows || !A.cols) {
    S.X = NaN;
    return;
  }
  // ✅ CASE 1: (2 × n)  (polar → rectangular)
  if (A.rows === 2) {
    let n = A.cols;
    let newData = new Array(2 * n);
    for (let c = 0; c < n; c++) {
      let r = A.data[c];
      let theta = toRad(A.data[n + c]);
      newData[c] = r * Math.cos(theta);
      newData[n + c] = r * Math.sin(theta);
    }
    M[name] = {
      rows: 2,
      cols: n,
      data: newData
    };
    justCalculated = true;
    liftOnNextDigit = true;
    return;
  }

  // ✅ ✅ CASE 2: (2n × 1) → THIS IS YOUR CASE
  if (A.cols === 1 && A.rows % 2 === 0) {
    let n = A.rows / 2;
    let result = {
      rows: n,
      cols: 2,
      data: new Array(n * 2)
    };
    // ✅ BUILD EXACT HP LAYOUT:
    // [ Re₁  Im₁
    //   Re₂  Im₂ ]
    for (let i = 0; i < n; i++) {
      let re = A.data[i];
      let im = A.data[i + n];
      result.data[i * 2 + 0] = re;  // column 1
      result.data[i * 2 + 1] = im;  // column 2
    }
    // ✅ overwrite SAME matrix
    M[name] = result;
    // ✅ KEEP descriptor
    S.X = matrixRef(name);
    justCalculated = true;
    liftOnNextDigit = true;
    return;
  }
  // ❌ unsupported
  S.X = NaN;
}

/* =========================

========================= */
function pressKey(r, c) {
  //  Only allow ON when powered off
  if (!powerOn && !(r === 4 && c === 1)) {
    return;
  }
  let key = `${r},${c}`;
  let normalInstr = keyMap.normal[key];
  const isShiftKey =
    normalInstr?.op === "shiftF" ||
    normalInstr?.op === "shiftG";
  const isAEKey = ["1,1","1,2","1,3","1,4","1,5"].includes(key);
  let instr;
  if (displayError) {
    displayError = "";
    updateDisplay();
    return;
}

  /* =========================
      PRIORITY KEY ROUTING
  ========================= */
if (programMode) {
  let rawInstr = keyMap.normal[`${r},${c}`];
  if (rawInstr?.op === "shiftF") {
    startInstruction();
    pushByteRight("42");
    state = "EXPECT_ONE_KEY";
  }
  if (rawInstr?.op === "shiftG") {
    startInstruction();
    pushByteRight("43");
    state = "EXPECT_ONE_KEY";
  }
}
// 1. SHIFT KEYS ALWAYS WIN
if (isShiftKey) {
  instr = normalInstr;
console.log(
    "ROUTE",
    "pendingCommand=", pendingCommand,
    "instr=", instr?.op,
    "key=", key
);
  exec(instr);   // ✅ execute immediately
  updateDisplay();
  return;        // ✅ STOP HERE (CRITICAL)
}

//  2. COMMAND MODES MUST OVERRIDE SHIFT ✅
// ✅ RCL + DIM (SIN key) override
else if (pendingCommand === "RCL" && key === "2,3") {
  instr = { op: "dim" };
}
// DIM MODE
else if (pendingCommand === "DIM") {
  if (!isAEKey) return;
  instr = { op: `key_${["A","B","C","D","E"][["1,1","1,2","1,3","1,4","1,5"].indexOf(key)]}` };
}
// RESULT TARGET
else if (pendingResultTarget && isAEKey) {
  instr = { op: `key_${["A","B","C","D","E"][["1,1","1,2","1,3","1,4","1,5"].indexOf(key)]}` };
}
// MATRIX COMMAND MODE
else if (pendingCommand === "MATRIX_CMD") {
  instr = normalInstr;
}
else if (shiftF || shiftG) {
  const isAEKey = ["1,1","1,2","1,3","1,4","1,5"].includes(key);
  // ✅ CRITICAL FIX: intercept STO/RCL + g + A–E
  if (shiftG &&
      pendingCommand &&
      (pendingCommand === "STO" || pendingCommand === "RCL") &&
      isAEKey) {
    instr = {
      op: `key_${["A","B","C","D","E"][["1,1","1,2","1,3","1,4","1,5"].indexOf(key)]}`
    };
  }
  else {
    let shifted = shiftF ? keyMap.f[key] : keyMap.g[key];
    instr = shifted || normalInstr;
  }
}

//  3. DIM MODE
else if (pendingCommand === "DIM") {
  if (!isAEKey) return;
  instr = keyMap.f[key];
}
//  4. RESULT TARGET
else if (pendingResultTarget && isAEKey) {
  instr = keyMap.f[key];
}
//  5. MATRIX COMMAND MODE
else if (pendingCommand === "MATRIX_CMD") {
  if (!isAEKey && !normalInstr) return;
  instr = isAEKey ? keyMap.f[key] : normalInstr;
}
else if (USER && isAEKey) {

    "1,3": { op: "key_C" },
    "1,4": { op: "key_D" },

}
// 7. STO / RCL override
else if (

{

function startInstruction() {
  buildBuffer = [];
}

function pushByteRight(byte) {
  buildBuffer.push(byte);
  console.log("BUILD BUFFER:", buildBuffer);
  updateDisplay();
}

function finalizeInstruction() {
  if (buildBuffer.length === 0) return;
labelMode = false;
  // PRGM block
  if (buildBuffer.length === 1) {
    let first = buildBuffer[0];
    let key = `${first[0]},${first[1]}`;
    let instr =
      keyMap.normal[key] ||
      keyMap.f[key] ||
      keyMap.g[key];
    if (instr && instr.op === "prgm") {
      buildBuffer = [];
      state = "IDLE";
      return;
    }
  }
  let bytes = [...buildBuffer];
  // ✅ memory guard (correct)
  if (progSize >= MAX_STEPS - 1) {
    buildBuffer = [];
    return;
  }
let insertIndex = pc + 1;
prog.splice(insertIndex, 0, { bytes });
progSize++;
pc = insertIndex;
  buildBuffer = [];
  updateDisplay();
}

if (

  instr.op !== "rs" &&
  instr.op !== "PR" &&

  instr.op !== "bst" &&
  instr.op !== "sst" &&

)
{

  state = "IDLE";
  buildBuffer = [];
  return;

  let byte = encodeKey(r, c);

console.log(

    "pendingCommand=", pendingCommand
);
console.log(
  "STATE=", state,
  "BUFFER=", buildBuffer,
  "OP=", op
);
  switch(state) {
case "IDLE":
if (op === "shiftF" || op === "shiftG") {
  // ✅ DO NOT start new instruction if one already in progress
  if (buildBuffer.length === 0) {
    startInstruction();
  }
  // ✅ push prefix byte
  if (op === "shiftF") {
    pushByteRight("42");
  } else {
    pushByteRight("43");
  }
  state = "EXPECT_ONE_KEY";
  return;
}
if (prefixOps.includes(op)) {
  // ✅ CRITICAL: do NOT reset buffer if shift already started it
  if (buildBuffer.length === 0) {
    startInstruction();
  }
  pushByteRight(byte);
if (op === "lbl") {
  labelMode = true;        // ✅ NEW
  state = "EXPECT_LBL_ARG";
} else {
    state = "EXPECT_PREFIX_ARG";
  }

/* ======================================================================================
   COMPLEX ENGINE
====================================================================================== */
function complex(re, im=0){
  return { re, im };
}

function isComplex(x){
  return x && typeof x === "object" && "re" in x && "im" in x;
}

// Convert real → complex
function toComplex(x){
  return isComplex(x) ? x : complex(x,0);
}

/* ==== BASIC OPS ==== */
function cAdd(a,b){
  a=toComplex(a); b=toComplex(b);
  return complex(a.re+b.re, a.im+b.im);
}

function cSub(a, b){
  a = toComplex(a);
  b = toComplex(b);
  return complex(
    a.re - b.re,
    a.im - b.im
  );
}

function cMul(a,b){
  a=toComplex(a); b=toComplex(b);
  return complex(
    a.re*b.re - a.im*b.im,
    a.re*b.im + a.im*b.re
  );
}

function cDiv(a,b){
  a=toComplex(a); b=toComplex(b);
  let d = b.re*b.re + b.im*b.im;
  return complex(
    (a.re*b.re + a.im*b.im)/d,
    (a.im*b.re - a.re*b.im)/d
  );
}

function cExp(z){
  let ea = Math.exp(z.re);
  return complex(
    ea * Math.cos(z.im),
    ea * Math.sin(z.im));
  
}

function cLn(z){
  let mag = Math.hypot(z.re, z.im);
  let ang = Math.atan2(z.im, z.re);
  return complex(Math.log(mag), ang);
}

function cSin(z){
  return complex(
    Math.sin(z.re)*Math.cosh(z.im),
    Math.cos(z.re)*Math.sinh(z.im)
  );
}

function cCos(z){
  return complex(
    Math.cos(z.re)*Math.cosh(z.im),
   -Math.sin(z.re)*Math.sinh(z.im)
  );
}

function cTan(z){
  return cDiv(cSin(z), cCos(z));
}

function cSinh(z){
  return complex(
    Math.sinh(z.re)*Math.cos(z.im),
    Math.cosh(z.re)*Math.sin(z.im)
  );
}

function cCosh(z){
  return complex(
    Math.cosh(z.re)*Math.cos(z.im),
    Math.sinh(z.re)*Math.sin(z.im)
  );
}

function cTanh(z){
  return cDiv(cSinh(z), cCosh(z));
}

function cSqrt(z){
  let r = Math.hypot(z.re, z.im);
  let theta = Math.atan2(z.im, z.re);
  let sqrtR = Math.sqrt(r);
  let halfTheta = theta / 2;
  return complex(
    sqrtR * Math.cos(halfTheta),
    sqrtR * Math.sin(halfTheta)
  );
}

function cDivScalar(z, s){
  return complex(z.re / s, z.im / s);
}

function cMulScalar(z, s){
  return complex(z.re * s, z.im * s);
}

function iMul(z){ // i * z
  return complex(-z.im, z.re);
}

function negIMul(z){ // -i * z
  return complex(z.im, -z.re);
}

    entering = false;
    inputBuffer = "";
    justCalculated = true;
    liftOnNextDigit = true;
    shiftF = false;
    shiftG = false;
    break;
  }

  // Normal real-stack coordinate conversion.
  const x = S.X;
  const y = S.Y;

  const r = Math.hypot(x, y);
  const theta = fromRad(Math.atan2(y, x));

  S.X = clean(r);
  S.Y = clean(theta);

  entering = false;
  inputBuffer = "";
  justCalculated = true;
  liftOnNextDigit = true;
  shiftF = false;
  shiftG = false;

  //
  // Complex mode, HP-15C Section 11:

  if (entering) {

    entering = false;
    inputBuffer = "";

  // Normal real-stack coordinate conversion.
  const r = S.X;
  const theta = toRad(S.Y);

  const x = r * Math.cos(theta);
  const y = r * Math.sin(theta);

  S.X = clean(x);
  S.Y = clean(y);

  entering = false;
  inputBuffer = "";
  justCalculated = true;
  liftOnNextDigit = true;
  shiftF = false;

case "toHMS": {

  if (entering) {
    S.X = parseFloat(inputBuffer || "0");
    entering = false;
    inputBuffer = "";
  }
  saveLastX();
  let h = S.X;
  let hours = Math.trunc(h);
  let minutesFull = (h - hours) * 60;
  let minutes = Math.trunc(minutesFull);
  let seconds = (minutesFull - minutes) * 60;
  //  Round to 1/100000 second
  seconds = Math.round(seconds * 100000) / 100000;
  //  Handle rollover (important!)
  if (seconds >= 60) {
    seconds -= 60;
    minutes += 1;
  }
  if (minutes >= 60) {
    minutes -= 60;
    hours += 1;
  }
  //  Pack into H.MMSSsssss format
  // (HP-style encoded decimal)
  let result =
      hours +
      minutes / 100 +
      seconds / 10000;
  S.X = result;
  entering = false;
  inputBuffer = "";
  justCalculated = true; liftOnNextDigit = true;
  break;
}

      hours +

      (seconds / 3600);
  S.X = result;
  entering = false;
  inputBuffer = "";
  justCalculated = true; liftOnNextDigit = true;
  break;
}

function formatProgramLine(step) {
  let line = prog[step];

  if (!line || !line.bytes) {
    return `${step.toString().padStart(3,"0")}-`;
  }

  let bytes = line.bytes;
  let out = [];

  // ✅ Detect STO / RCL
  const isStoRcl =
    bytes.length > 0 &&
    (bytes[0] === "44" || bytes[0] === "45");

  for (let i = 0; i < bytes.length; i++) {
    let b = bytes[i];
    
    if (typeof b === "string" && b.startsWith(".")) {
        out.push(b);
        continue;
    }

    let instr = decodeByte(b);

    // ✅ STO / RCL always show raw
    if (b === "44" || b === "45") {
      out.push(b);
      continue;
    }

    // ✅ OPERATORS also raw
    if (["40","41","42","43"].includes(b)) {
      out.push(b);
      continue;
    }


// ✅ DOT HANDLING (HP-style merge ALWAYS)
if (instr.op === "dot") {

  if (i + 1 < bytes.length) {
    let next = bytes[i + 1];
    let nextInstr = decodeByte(next);

    if (nextInstr.op === "digit") {
      out.push("." + nextInstr.v);
      i++; // consume digit
      continue;
    }
  }

  // fallback (rare)
  out.push(".");
  continue;
}


    // ✅ DIGIT (use decoder — IMPORTANT)
    if (instr.op === "digit") {
      out.push(instr.v.toString());
      continue;
    }

    // ✅ default
    out.push(b);
  }

  return `${step.toString().padStart(3,"0")}- ${out.join(",")}`;
}


function decodeByte(byte) {

  if (!byte) {
    console.warn("Bad byte:", byte);
    return { op: "noop" };
  }

  // ✅ DIGIT (your format)
  if (byte.length === 1 && byte >= "0" && byte <= "9") {
    return { op: "digit", v: Number(byte) };
  }

  // ✅ DOT DIGIT (.n)
  if (byte.startsWith("dot")) {
    return { op: "dotdigit", v: Number(byte.slice(3)) };
  }

  // ✅ NORMAL 2-byte key decode
  if (byte.length === 2) {

    let r = Number(byte[0]);
    let c = Number(byte[1]);

    let key = `${r},${c}`;

    let instr =
      keyMap.normal[key] ||
      keyMap.f[key] ||
      keyMap.g[key];

    if (!instr) {
      console.warn("Unknown key decode:", key);
      return { op: "noop" };
    }

    return instr;
  }

  // ✅ fallback
  console.warn("Unhandled byte format:", byte);
  return { op: "noop" };
}

function gamma(z) {
  const g = 7;
  const p = [
    0.99999999999980993,
    676.5203681218851,
   -1259.1392167224028,
    771.32342877765313,
   -176.61502916214059,
    12.507343278686905,
   -0.13857109526572012,
    9.9843695780195716e-6,
    1.5056327351493116e-7
  ];
  if (z < 0.5) {
    return Math.PI / (Math.sin(Math.PI * z) * gamma(1 - z));
  }
  z -= 1;
  let x = p[0];
  for (let i = 1; i < g + 2; i++) {
    x += p[i] / (z + i);
  }
  const t = z + g + 0.5;
  return Math.sqrt(2 * Math.PI) * Math.pow(t, z + 0.5) * Math.exp(-t) * x;
}

  let converged = false;

  let failedParabolicSteps = 0;

  for (let iter = 0; iter < 100; iter++) {
    let c;

    if (fb !== fa) {
      c = b - fb * (b - a) / (fb - fa);
    } else {
      c = NaN;
    }

    if (bracketed) {
      let lo = Math.min(a, b);
      let hi = Math.max(a, b);

      if (!Number.isFinite(c) || c <= lo || c >= hi) {
        c = (a + b) / 2;
      }
    } else {
      if (!Number.isFinite(c)) {
        let step = b - a;

        if (step === 0) {
          step = (b === 0) ? 1 : Math.abs(b) * 0.1;
        }

        c = b + step;
      } else {
        let maxStep = 100 * Math.max(Math.abs(b - a), solveTolerance(b));

        if (Math.abs(c - b) > maxStep) {
          c = b + Math.sign(c - b) * maxStep;
        }
      }
    }

    let fc = evalLabelAt(c);

    if (!Number.isFinite(fc)) {
      break;
    }

    let cSample = { x: c, fx: fc };
    samples.push(cSample);

    if (samples.length > 8) {
      samples.shift();
    }

    best = chooseBestSample(samples);
    other = chooseOtherSample(samples, best);

    if (Math.abs(fc) < Math.abs(fRoot)) {
      root = c;
      fRoot = fc;
    }

    if (
      fc === 0 ||
      Math.abs(fc) < 1e-12 ||
      Math.abs(c - b) <= solveTolerance(c)
    ) {
      converged = true;
      root = c;
      fRoot = fc;
      other = { x: b, fx: fb };
      break;
    }

    if (oppositeSign(fa, fc)) {
      b = c;
      fb = fc;
      bracketed = true;
      failedParabolicSteps = 0;
      continue;
    }

    if (oppositeSign(fb, fc)) {
      a = b;
      fa = fb;
      b = c;
      fb = fc;
      bracketed = true;
      failedParabolicSteps = 0;
      continue;
    }

    if (!bracketed && Math.abs(fc) >= Math.abs(fb)) {
      if (samples.length >= 3) {
        let s0 = samples[samples.length - 3];
        let s1 = samples[samples.length - 2];
        let s2 = samples[samples.length - 1];

        let x0 = s0.x;
        let x1 = s1.x;
        let x2 = s2.x;

        let y0 = Math.abs(s0.fx);
        let y1 = Math.abs(s1.fx);
        let y2 = Math.abs(s2.fx);

        let denom =
          (x0 - x1) * (x0 - x2) * (x1 - x2);

        if (denom !== 0) {
          let A =
            (x2 * (y1 - y0) +
             x1 * (y0 - y2) +
             x0 * (y2 - y1)) / denom;

          let B =
            (x2 * x2 * (y0 - y1) +
             x1 * x1 * (y2 - y0) +
             x0 * x0 * (y1 - y2)) / denom;

          if (A !== 0) {
            let d = -B / (2 * A);

            if (Number.isFinite(d) && d !== b) {
              let fd = evalLabelAt(d);

              if (Number.isFinite(fd)) {
                samples.push({ x: d, fx: fd });

                if (samples.length > 8) {
                  samples.shift();
                }

                if (Math.abs(fd) < Math.abs(best.fx)) {
                  a = b;
                  fa = fb;
                  b = d;
                  fb = fd;

                  best = chooseBestSample(samples);
                  other = chooseOtherSample(samples, best);

                  failedParabolicSteps = 0;
                  continue;
                }
              }
            }
          }
        }
      }

      failedParabolicSteps++;

      if (failedParabolicSteps >= 3) {
        break;
      }
    } else {
      failedParabolicSteps = 0;
    }

    a = b;
    fa = fb;

    b = c;
    fb = fc;
  }

  best = chooseBestSample(samples);
  other = chooseOtherSample(samples, best);

  restoreTransientState();

  pendingCommand = null;
  prefixDisplay = "";

  shiftF = false;
  shiftG = false;

  entering = false;
  inputBuffer = "";

  if (converged) {
    S.X = root;
    S.Y = other.x;
    S.Z = fRoot;

    justCalculated = true;
    liftOnNextDigit = true;

    updateDisplay();
    return;
  }

  S.X = best.x;
  S.Y = other.x;
  S.Z = best.fx;

  displayError = "Error 8";

  justCalculated = true;
  liftOnNextDigit = true;

  updateDisplay();
}

/*
  HP-15C-style numerical integration, first implementation.

  Usage:
    Y = lower limit a
    X = upper limit b
    f ∫ label

  Result:
    X = integral approximation
    Y = uncertainty estimate
    Z = original upper limit b
    T = original lower limit a
*/
function executeIntegrate(label) {
  rebuildLabels();

  if (!(label in labels)) {
    displayError = "Error 4";
    pendingCommand = null;
    prefixDisplay = "";
    updateDisplay();
    return;
  }

  if (entering) {
    S.X = parseFloat(inputBuffer || "0");
    entering = false;
    inputBuffer = "";
  }

  const a = S.Y;
  const b = S.X;

  if (!Number.isFinite(a) || !Number.isFinite(b)) {
    displayError = "Error 0";
    pendingCommand = null;
    prefixDisplay = "";
    updateDisplay();
    return;
  }

  if (a === b) {
    S.T = a;
    S.Z = b;
    S.Y = 0;
    S.X = 0;
    pendingCommand = null;
    prefixDisplay = "";
    shiftF = false;
    shiftG = false;
    justCalculated = true;
    liftOnNextDigit = true;
    updateDisplay();
    return;
  }

  const savedS = { ...S };
  const savedIM = { ...IM };
  const savedR = R.slice();
  const savedLastX = lastX;
  const savedLastIMX = lastIMX;
  const savedPendingCommand = pendingCommand;
  const savedPrefixDisplay = prefixDisplay;
  const savedShiftF = shiftF;
  const savedShiftG = shiftG;
  const savedEntering = entering;
  const savedInputBuffer = inputBuffer;
  const savedJustCalculated = justCalculated;
  const savedLiftOnNextDigit = liftOnNextDigit;
  const savedContinueEntry = continueEntry;
  const savedExecRunning = execRunning;
  const savedExecPC = execPC;
  const savedCallStack = callStack.slice();
  const savedProgramJumped = programJumped;
  const savedDoIfTrue = DoIfTrue;

  function restoreTransientState() {
    IM = { ...savedIM };
    R = savedR.slice();
    lastX = savedLastX;
    lastIMX = savedLastIMX;
    pendingCommand = savedPendingCommand;
    prefixDisplay = savedPrefixDisplay;
    shiftF = savedShiftF;
    shiftG = savedShiftG;
    entering = savedEntering;
    inputBuffer = savedInputBuffer;
    justCalculated = savedJustCalculated;
    liftOnNextDigit = savedLiftOnNextDigit;
    continueEntry = savedContinueEntry;
    execRunning = savedExecRunning;
    execPC = savedExecPC;
    callStack = savedCallStack.slice();
    programJumped = savedProgramJumped;
    DoIfTrue = savedDoIfTrue;
  }

  function evalLabelAt(x) {
    // HP-15C INTEGRATE behavior:
    // Each sampled x must be placed into the entire real stack.
    // This allows the integration subroutine to reuse x with
    // ENTER, R↓, R↑, and x↔y, just like the real HP-15C.
    S = {
      X: x,
      Y: x,
      Z: x,
      T: x
    };

    // The HP-15C numeric integration does not use the imaginary stack here.
    IM = {
      X: 0,
      Y: 0,
      Z: 0,
      T: 0
    };

    entering = false;
    inputBuffer = "";
    shiftF = false;
    shiftG = false;
    pendingCommand = null;
    prefixDisplay = "";
    continueEntry = false;
    justCalculated = false;
    liftOnNextDigit = true;
    DoIfTrue = true;

    let pcLocal = labels[label] + 1;
    let guard = 0;

    while (pcLocal <= progSize && guard < MAX_STEPS) {
      guard++;

      let line = prog[pcLocal];

      if (!line || !line.bytes) {
        pcLocal++;
        continue;
      }

      let bytes = line.bytes;

      // Stop at RTN: g RTN is stored as 43,32 in your encoder.
      if (bytes.length === 2 && bytes[0] === "43" && bytes[1] === "32") {
        return S.X;
      }

      // If another LBL is encountered before RTN, stop.
      // This keeps one labeled function from falling into the next.
      if (
        bytes.length >= 2 &&
        bytes[0] === "42" &&
        bytes[1] === "21"
      ) {
        return S.X;
      }

      // Execute the recorded key sequence exactly like normal program execution.
      for (let byte of bytes) {
        if (typeof byte !== "string" || byte.length !== 2) continue;

        let r = Number(byte[0]);
        let c = Number(byte[1]);

        pressKey(r, c);

        if (displayError) {
          return NaN;
        }
      }

      pcLocal += (DoIfTrue === false ? 2 : 1);
      DoIfTrue = true;
    }

    if (guard >= MAX_STEPS) {
      displayError = "Error 5";
      return NaN;
    }

    return S.X;
  }

  function simpson(fa, fm, fb, left, right) {
    return (right - left) * (fa + 4 * fm + fb) / 6;
  }

  function displayDigitsForIntegration() {
    if (displayMode === "FIX" || displayMode === "SCI" || displayMode === "ENG") {
      return Math.max(0, Math.min(9, fixDigits));
    }

    // NORMAL display uses your 10 significant digit formatter.
    return 9;
  }

  const digits = displayDigitsForIntegration();
  const relTol = Math.pow(10, -digits);
  const absTol = Math.pow(10, -(digits + 2));

  function adaptiveSimpson(left, right, fa, fm, fb, whole, tol, depth) {
    const mid = (left + right) / 2;
    const lm = (left + mid) / 2;
    const rm = (mid + right) / 2;

    const flm = evalLabelAt(lm);
    const frm = evalLabelAt(rm);

    if (
      !Number.isFinite(fa) ||
      !Number.isFinite(fm) ||
      !Number.isFinite(fb) ||
      !Number.isFinite(flm) ||
      !Number.isFinite(frm)
    ) {
      return { value: NaN, uncertainty: NaN };
    }

    const leftApprox = simpson(fa, flm, fm, left, mid);
    const rightApprox = simpson(fm, frm, fb, mid, right);
    const refined = leftApprox + rightApprox;
    const diff = refined - whole;

    if (depth <= 0 || Math.abs(diff) <= 15 * tol) {
      return {
        value: refined + diff / 15,
        uncertainty: Math.abs(diff / 15)
      };
    }

    const leftResult = adaptiveSimpson(
      left, mid,
      fa, flm, fm,
      leftApprox,
      tol / 2,
      depth - 1
    );

    const rightResult = adaptiveSimpson(
      mid, right,
      fm, frm, fb,
      rightApprox,
      tol / 2,
      depth - 1
    );

    return {
      value: leftResult.value + rightResult.value,
      uncertainty: leftResult.uncertainty + rightResult.uncertainty
    };
  }

  const fa = evalLabelAt(a);
  const fb = evalLabelAt(b);
  const mid = (a + b) / 2;
  const fm = evalLabelAt(mid);
  const first = simpson(fa, fm, fb, a, b);

  const tol = Math.max(absTol, Math.abs(first) * relTol);
  const result = adaptiveSimpson(a, b, fa, fm, fb, first, tol, 20);

  restoreTransientState();

  if (!Number.isFinite(result.value) || !Number.isFinite(result.uncertainty)) {
    displayError = displayError || "Error 0";
    pendingCommand = null;
    prefixDisplay = "";
    updateDisplay();
    return;
  }

  // HP-15C post-integration stack layout:
  // T = lower limit
  // Z = upper limit
  // Y = uncertainty
  // X = approximation
  S.T = a;
  S.Z = b;
  S.Y = result.uncertainty;
  S.X = result.value;

  IM.T = 0;
  IM.Z = 0;
  IM.Y = 0;
  IM.X = 0;

  pendingCommand = null;
  prefixDisplay = "";
  shiftF = false;
  shiftG = false;
  entering = false;
  inputBuffer = "";
  justCalculated = true;
  liftOnNextDigit = true;

  updateDisplay();
}


/* =========================
   PROGRAM engine
========================= */

function programExecute() {
  entering = false;
  inputBuffer = "";
  justCalculated = true;
  liftOnNextDigit = true;
  programMode = false;
  DoIfTrue = true;
  let startIndex = -1;

  // ✅ 1. Find the LBL start: 42,21,programStart
  for (let i = 0; i < progSize; i++) {
    let line = prog[i];
    if (!line || !line.bytes) continue;
    let b = line.bytes;
    if (
      b.length === 3 &&
      b[0] === "42" &&   // f
      b[1] === "21" &&   // LBL
      b[2] === String(programStart)
    ) {
      startIndex = i + 1; // ✅ start AFTER label
      break;
    }
  }

if (startIndex === -1) {
    console.warn("Program start not found");
    S.X = "Error 4"
    return;
}

callStack = [];
callStack.push(startIndex);
execPC = startIndex;
execRunning = true;
console.log("CALLING STEP");
  step();
}

  function step() {
    
console.log(
    "STEP ENTRY",
    "execPC=", execPC,
    "running=", execRunning,
    "time=", Date.now()
);

    console.log(
        "STEP",
        "execPC=", execPC,
        "progSize=", progSize
    );

if (!execRunning) {
  finishProgram();   // ✅ handle RTN stop
  return;
}

console.log(
  "STEP",
  "execPC=", execPC,
  "progSize=", progSize
);

if (execPC > progSize) {
  console.log("Program END");   // ✅ will now fire
  finishProgram();               // ✅ cleanup runs
  return;
}

    let line = prog[execPC];
    if (!line || !line.bytes) {
      execPC ++;
      setTimeout(step, 10);
      return;
    }


console.log(
    "LINE",
    execPC,
    JSON.stringify(line.bytes)
);

    let bytes = line.bytes;

    // ✅ 3. Execute each byte as a key press
    for (let byte of bytes) {
      // skip weird custom tokens like "dot5"
      if (typeof byte !== "string" || byte.length !== 2) continue;
      let r = Number(byte[0]);
      let c = Number(byte[1]);
      // ✅ simulate *real key press*
      pressKey(r, c);
    }


if (!programJumped) {
    execPC += (DoIfTrue === false ? 2 : 1);
}

programJumped = false;

DoIfTrue = true;
if (execPauseUntil > Date.now()) {
    setTimeout(step, execPauseUntil - Date.now());
    return;
}
    setTimeout(step, 30);
  }

function finishProgram() {
  execRunning = false;
callStack = [];
  entering = false;
  inputBuffer = "";

  liftOnNextDigit = true;
  justCalculated = true;
  continueEntry = false;

  console.log("PROGRAM FINISHED", {
    entering, DoIfTrue,
    liftOnNextDigit
  });
}


/* =========================
   DISPLAY
========================= */
function fmt(v){
if (isMatrix(v)) {
  let m = M[v.name];
  if (!m || !m.rows || !m.cols) {
    return `${v.name} 0,0`;
  }

  return `${v.name} ${m.rows},${m.cols}`;
}

  if (!Number.isFinite(v)) return "ERR";
  //  SCI
  if (displayMode === "SCI") {
    return v.toExponential(fixDigits);
  }
  //  FIX
  if (displayMode === "FIX") {
    return v.toFixed(fixDigits);
  }
  //  ENG
  if (displayMode === "ENG") {
    if (v === 0) {
      return (0).toFixed(fixDigits) + "e0";
    }
    let sign = v < 0 ? "-" : "";
    v = Math.abs(v);
    let exp = Math.floor(Math.log10(v) / 3) * 3;
    let scaled = v / Math.pow(10, exp);
    if (scaled >= 1000) {
      scaled /= 1000;
      exp += 3;
    }
    return sign + scaled.toFixed(fixDigits) + "e" + exp;
  }

  //  NORMAL
  let out = Number(v).toPrecision(10);
  out = out.replace(/(\.\d*?[1-9])0+$/, "$1");
  out = out.replace(/\.0+$/, "");
  return out;
}

function updateDisplay(){
  updateFlagsDisplay();
  if (!powerOn) {
    document.getElementById("dispX").innerText = "";
    document.getElementById("dispY").innerText = "";
    document.getElementById("dispZ").innerText = "";
    document.getElementById("dispT").innerText = "";
    return;
  }

if (displayError) {
  document.getElementById("dispX").innerText = displayError;
  document.getElementById("dispY").innerText = "";
  document.getElementById("dispZ").innerText = "";
  document.getElementById("dispT").innerText = "";
  return;
}


function formatForDisplay(value, isX = false) {

if (isX && matrixStorePreview) {
  return `${matrixStorePreview.name} ${matrixStorePreview.row},${matrixStorePreview.col}`;
}

  //  PREFIX HOLD MODE
  if (prefixHold && isX) {
    if (!Number.isFinite(value)) return "ERR";

    // Convert to full precision string
    let s = Number(value).toPrecision(12);

    // Remove decimal point
    s = s.replace(".", "");

    // Remove leading zeros if needed (optional)
    return s;
  }

  //  Normal entry behavior
  if (isX && entering && inputBuffer !== "") {
    return inputBuffer;
  }
  return fmt(value);
}

//  Choose which stack to DISPLAY
const activeStack = viewIM ? IM : S;
document.getElementById("dispX").innerText =
  formatForDisplay(activeStack.X, true);
document.getElementById("dispY").innerText =
  formatForDisplay(activeStack.Y);
document.getElementById("dispZ").innerText =
  formatForDisplay(activeStack.Z);
document.getElementById("dispT").innerText =
  formatForDisplay(activeStack.T);

let modeText = angleMode;

if (displayMode === "FIX") {
    modeText = `FIX${fixDigits} ${angleMode}`;
}
else if (displayMode === "SCI") {
    modeText = `SCI${fixDigits} ${angleMode}`;
}
else if (displayMode === "ENG") {
    modeText = `ENG${fixDigits} ${angleMode}`;
}


document.getElementById("statusFlags").innerText =
  modeText +
  (prefixDisplay ? " " + prefixDisplay : "") +
  (iHypMode ? " iHYP " : "") +
  (hypMode ? " HYP " : "") +
  (shiftF ? " f " : "") +
  (shiftG ? " g " : "");
  if (viewIM) {
  document.getElementById("statusFlags").innerText += "  IM";
}

let modeLabel = "";

if (USER) modeLabel += "USER ";
if (F[8]) modeLabel += "C";

// ✅ Program mode (PRGM)
if (programMode) {
  let displayLine = pc;
  let lineText = formatProgramLine(displayLine);
  document.getElementById("dispX").innerText = lineText;
  document.getElementById("dispY").innerText = "";
  document.getElementById("dispZ").innerText = "";
  document.getElementById("dispT").innerText = "";
  document.getElementById("statusMode").innerHTML = "PRGM";
    return;
}
document.getElementById("statusMode").innerText = modeLabel;
renderRegisters();
}
function renderRegisters() {
  const PER_ROW = 3;

  function row(items) {
    return `<div style="margin:2px 0;">${items.join(" &nbsp;&nbsp;&nbsp;&nbsp; ")}</div>`;
  }

  function f(label, index) {
    return `${label}: ${fmt(R[index])}`;
  }
  let lines = [];
  // ✅ R66 (I register)
  lines.push(row([
    f("R66, I", 66)
  ]));
  // ✅ R0–R9  (numeric labels)
  let rBlock = [];
  for (let i = 0; i <= 9; i++) {
    rBlock.push(f(`R${i}, ${i}`, i));
  }
  for (let i = 0; i < rBlock.length; i += PER_ROW) {
    lines.push(row(rBlock.slice(i, i + PER_ROW)));
  }
  // ✅ R10–R19  (.0–.9)
  let rdBlock = [];
  for (let i = 10; i <= 19; i++) {
    rdBlock.push(f(`R${i}, .${i - 10}`, i));
  }
  for (let i = 0; i < rdBlock.length; i += PER_ROW) {
    lines.push(row(rdBlock.slice(i, i + PER_ROW)));
  }
  // ✅ R20–R24  (A–E)
  let names = ["A","B","C","D","E"];
  let raBlock = [];
  for (let i = 0; i < 5; i++) {
    raBlock.push(f(`R${20 + i}, ${names[i]}`, 20 + i));
  }
  for (let i = 0; i < raBlock.length; i += PER_ROW) {
    lines.push(row(raBlock.slice(i, i + PER_ROW)));
  }
  // ✅ R25–R65 (plain numeric)
  let remaining = [];
  for (let i = 25; i <= 65; i++) {
    remaining.push(f(`R${i}`, i));
  }
  for (let i = 0; i < remaining.length; i += PER_ROW) {
    lines.push(row(remaining.slice(i, i + PER_ROW)));
  }
  // ✅ Render (centered)
  document.getElementById("registerPanel").innerHTML =
    `<div style="text-align:center;">${lines.join("")}</div>`;
}


/* =========================

========================= */
function getCalculatorState() {
    return {
        S,
        IM,
        lastX,
        lastIMX,
        F,
        R,
        M,
        USER,
        angleMode,
        displayMode,
        fixDigits,
        rngSeed,
        prog,
        progSize,
        labels,
        pc,
        execPC,
        callStack
    };
}

function restoreCalculatorState(state) {
    Object.assign(S, state.S);
    Object.assign(IM, state.IM);
    lastX = state.lastX;
    lastIMX = state.lastIMX;
    F = state.F;
    R = state.R;
    M = state.M;
    USER = state.USER;
    angleMode  = state.angleMode;
    displayMode = state.displayMode;
    fixDigits   = state.fixDigits;
    rngSeed = state.rngSeed;
    prog = state.prog;
    progSize = state.progSize;
    labels = state.labels;
    pc = state.pc;
    execPC = state.execPC;
    callStack = state.callStack || [];
    updateDisplay();
}

function saveToBrowser() {
    localStorage.setItem(
        "HP15C_STATE",
        JSON.stringify(getCalculatorState())
    );
}

function loadFromBrowser() {
    let data =
        localStorage.getItem("HP15C_STATE");
    if (!data) return;
    restoreCalculatorState(
        JSON.parse(data)
    );
}

function exportStateFile() {
    const blob =
        new Blob(
            [
                JSON.stringify(
                    getCalculatorState(),
                    null,
                    2
                )
            ],
            {
                type: "application/json"
            }
        );
    const a =
        document.createElement("a");
    a.href =
        URL.createObjectURL(blob);
    a.download =
        "hp15c_state.json";
    a.click();
}

function importStateFile(file) {
    const reader =
        new FileReader();
    reader.onload = function(e) {
        const state =
            JSON.parse(e.target.result);
        restoreCalculatorState(state);
        updateDisplay();
    };
    reader.readAsText(file);
}


document

});

function saveMatrix(){
  if (!currentMatrixName) return;
  let m = M[currentMatrixName];
  let grid = document.getElementById("matrixGrid");
  let inputs = grid.querySelectorAll("input");
  inputs.forEach(input => {
    let idx = parseInt(input.dataset.index);
    m.data[idx] = parseFloat(input.value) || 0;
  });
  closeMatrix();
}

function closeMatrix(){
  document.getElementById("matrixEditor").style.display = "none";
  currentMatrixName = null;
}

updateDisplay();

// FLAGS FOR CALCULATOR SCREEN
function updateFlagsDisplay() {
  let html = "";


  /* =========================
     FLAGS
  ========================= */
  html += `<div style="margin-bottom:6px;">`;
  for (let i = 0; i <= 9; i++) {
    let isSet = F[i];
    html += `
      <span style="
        display:inline-block;
        margin:2px;
        padding:4px 6px;
        border-radius:4px;
        background:${isSet ? "#00ff88" : "#222"};
        border:${isSet ? "1px solid #00ff88" : "1px solid #111"};
        color:${isSet ? "#000" : "#777"};
        font-size:12px;
      ">
        F${i}
      </span>
    `;
  }
  html += `</div>`;

  /* =========================
     STACK DISPLAY
  ========================= */
  html += `
    <div style="
      display:flex;
      justify-content:center;
      gap:40px;
      margin-top:12px;
      font-family: monospace;
      font-size:14px;
    ">

      <div style="text-align:center;">
        <div style="color:#9dfc9d; margin-bottom:4px;">S</div>
        <div>T: ${fmt(S.T)}</div>
        <div>Z: ${fmt(S.Z)}</div>
        <div>Y: ${fmt(S.Y)}</div>
        <div>X: ${fmt(S.X)}</div>
      </div>

      <div style="text-align:center;">
        <div style="color:#6bb7ff; margin-bottom:4px;">IM</div>
        <div>T: ${fmt(IM.T)}</div>
        <div>Z: ${fmt(IM.Z)}</div>
        <div>Y: ${fmt(IM.Y)}</div>
        <div>X: ${fmt(IM.X)}</div>
      </div>

    </div>
  `;


  /* =========================
     MATRIX DISPLAY (GRID)
  ========================= */

const matricesActive = matrixEntryMode;
html += `
  <div style="
    margin-top:16px;
    font-family: monospace;
    font-size:13px;
    text-align:center;
    max-height:320px;
    overflow:auto;
    border-top:1px solid #333;
    padding-top:10px;
  ">
  <div style="
    color:${matricesActive ? "#6bb7ff" : "#f7c94b"};
    margin-bottom:8px;
    font-weight:${matricesActive ? "bold" : "normal"};
  ">
    MATRICES${matricesActive ? " ← ACTIVE" : ""}
  </div>
`;

  for (let name of ["A","B","C","D","E"]) {
    let m = M[name];

    //  EMPTY MATRIX
    if (!m || m.rows === 0) {
      html += `<div>${name}: 0×0 []</div>`;
      continue;
    }

    //  MATRIX HEADER
    html += `
      <div style="margin-top:8px; color:#ccc;">
        ${name}: ${m.rows}×${m.cols}
      </div>
    `;

    //  GRID
    for (let r = 0; r < m.rows; r++) {
      let row = [];
      for (let c = 0; c < m.cols; c++) {
        let idx = r * m.cols + c;
        let val = fmt(m.data[idx]);
        //  HIGHLIGHT CURRENT ENTRY POSITION

let currentIdx = getMatrixIndexFromR(m);
if (
  matrixEntryMode &&
  idx === currentIdx &&
  currentIdx >= 0
)

 {
          val = `<span style="
                    color:#000;
                    background:#6bb7ff;
                    padding:0 3px;
                    border-radius:3px;
                 ">${val}</span>`;
        }

        row.push(val);
      }

      html += `<div>[ ${row.join(" , ")} ]</div>`;
    }
  }

  html += `</div>`;

  /* =========================
     FINAL RENDER
  ========================= */
  document.getElementById("flagPanel").innerHTML = html;
}

</script>
